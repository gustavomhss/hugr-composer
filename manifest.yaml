skill:
  id: SKILL-001
  name: FastAPI Production
  version: 5.0.0
  description: >
    Convention over Configuration for FastAPI. 34 generators + 56 adapt tools = 105 MCP tools.
    Produce production-grade code — the LLM customizes business logic only.
    Scores 35/35 (100%) on 35-check production audit backed by
    OWASP, CVE, NIST, RFC, and CIS standards.
    352 files, 101,766 LOC. 56 adapt tools across 5 categories: extend, verify, operate, evolve, proactive.
    Lint-verified: ruff F-check on generated output = 22 F-errors, 0 critical F821, 85/85 py_compile pass.
  paradigm: convention-over-configuration
  mcp_server: mcp_server.py
  knowledge: core/KNOWLEDGE.md
  mcp_tools_total: 105

generators:
  total: 34
  categories:
    infra: 10
    database: 5
    auth: 5
    middleware: 5
    endpoints: 4
    schemas: 3
    deployment: 4
    observability: 3
    testing: 2
    orchestrator: 1
    evolve_generators: 3  # generate_sdk, generate_admin_panel, generate_docs

  orchestrator:
    tool: fastapi_generate_project
    description: "One call → 53-file production project"

  infra:
    app: { tool: fastapi_generate_app, generates: "main.py" }
    config: { tool: fastapi_generate_config, generates: "core/config.py" }
    dockerfile: { tool: fastapi_generate_dockerfile, generates: "Dockerfile + .dockerignore" }
    env_example: { tool: fastapi_generate_env_example, generates: ".env.example" }
    initial_data: { tool: fastapi_generate_initial_data, generates: "initial_data.py" }
    prestart: { tool: fastapi_generate_prestart, generates: "backend_pre_start.py" }
    readme: { tool: fastapi_generate_readme, generates: "README.md" }
    precommit: { tool: fastapi_generate_precommit, generates: ".pre-commit-config.yaml" }
    email: { tool: fastapi_generate_email, generates: "utils/email.py" }
    gitignore: { tool: fastapi_generate_gitignore, generates: ".gitignore" }

  database:
    engine: { tool: fastapi_generate_engine, generates: "core/db.py" }
    session: { tool: fastapi_generate_session, generates: "core/session.py" }
    model: { tool: fastapi_generate_model, generates: "models/{name}.py" }
    crud: { tool: fastapi_generate_crud, generates: "crud/{name}.py" }
    alembic: { tool: fastapi_generate_alembic, generates: "alembic/" }

  auth:
    all: { tool: fastapi_generate_auth, generates: "5 files (hasher, jwt, deps, routes, schemas)" }
    defaults:
      hasher: "argon2id via pwdlib (OWASP 2024)"
      jwt: "PyJWT (not python-jose — CVE-2024-33663)"
      timing: "DUMMY_HASH prevents enumeration (CWE-208)"
      recovery: "Same response for existing/non-existing emails"

  middleware:
    stack: { tool: fastapi_generate_middleware, generates: "middleware/ (5 files)" }
    order: "Correlation → CORS → SecurityHeaders → Logging (→ GZip)"

  endpoints:
    health: { tool: fastapi_generate_health, generates: "routes/health.py" }
    errors: { tool: fastapi_generate_errors, generates: "core/errors.py" }
    crud_routes: { tool: fastapi_generate_crud_routes, generates: "api/routes/{name}.py" }
    user_routes: { tool: fastapi_generate_user_routes, generates: "api/routes/users.py" }

  schemas:
    all: { tool: fastapi_generate_schemas, generates: "schemas/{name}.py + _public.py + _list.py" }

  deployment:
    docker_compose: { tool: fastapi_generate_docker_compose, generates: "docker-compose.yml" }
    k8s: { tool: fastapi_generate_k8s, generates: "k8s/ (6 files)" }
    ci: { tool: fastapi_generate_ci, generates: ".github/workflows/ci.yml" }
    loadtest: { tool: fastapi_generate_loadtest, generates: "loadtest.js" }

  observability:
    otel: { tool: fastapi_generate_otel, generates: "observability/telemetry.py" }
    prometheus: { tool: fastapi_generate_prometheus, generates: "observability/metrics.py" }
    alerting: { tool: fastapi_generate_alerting, generates: "alerts/ (2 files)" }

  testing:
    all: { tool: fastapi_generate_tests, generates: "tests/ (conftest + test suite)" }

adapt_tools_v5:
  total: 56
  input_contract: "adapt.contracts.ToolInput(project_dir: str, dry_run: bool = False)"
  output_contract: "adapt.contracts.ToolResult"
  categories:
    extend: 41
    verify: 7
    operate: 8
    evolve: 8
    proactive: 1

  extend:
    base_wiring:
      - fastapi_add_model        # model + CRUD + schemas + routes
      - fastapi_add_endpoint     # custom endpoint with inline Pydantic model
      - fastapi_add_middleware   # middleware at specific stack position
      - fastapi_add_background_job  # ARQ async job + optional cron
      - fastapi_add_websocket    # WebSocket + ConnectionManager + JWT auth
      - fastapi_add_integration  # stripe/s3/sendgrid/redis integrations
      - fastapi_migrate_db       # Alembic migration helper
    crud_data:
      - fastapi_add_soft_delete      # SoftDeleteMixin + do_orm_execute filter + migration
      - fastapi_add_cursor_pagination  # keyset cursor pagination
      - fastapi_add_file_upload      # multipart upload + validation
      - fastapi_add_search           # full-text multi-field search
      - fastapi_add_audit_log        # append-only audit trail
      - fastapi_add_data_export      # streaming CSV/JSON export
      - fastapi_add_bulk_operations  # bulk create/update/delete
    auth_access:
      - fastapi_add_rbac             # Role + Permission + UserRole + enforcement
      - fastapi_add_mfa              # TOTP-based MFA (pyotp)
      - fastapi_add_multi_tenancy    # tenant isolation via RLS + middleware
      - fastapi_add_feature_flags    # per-tenant/user feature flags
      - fastapi_add_api_key_auth     # API key auth alongside JWT
      - fastapi_add_oauth2_provider  # OAuth2 authorization code flow
    api_design:
      - fastapi_add_api_versioning   # /v1 /v2 URL-based versioning
      - fastapi_add_graphql          # Strawberry GraphQL schema + router
      - fastapi_add_batch_endpoint   # batch request endpoint
      - fastapi_add_long_running_task  # background task + polling status
    infrastructure:
      - fastapi_add_cache_layer      # Redis cache + @cached decorator
      - fastapi_add_circuit_breaker  # circuit breaker for outbound HTTP
      - fastapi_add_outbox_pattern   # transactional outbox for reliable events
      - fastapi_add_saga             # saga orchestrator for distributed transactions
      - fastapi_add_arq_worker       # async background job queue via arq
      - fastapi_add_stripe_checkout  # Stripe Checkout Session + webhook reconciliation
      - fastapi_add_email_templates  # Jinja2 transactional email with pluggable providers
    realtime:
      - fastapi_add_sse              # Server-Sent Events
      - fastapi_add_webhook_sender   # outbound webhook delivery with retry
      - fastapi_add_webhook_receiver  # inbound webhook + signature validation
      - fastapi_add_websocket_chat   # real-time WebSocket chat with JWT auth + Redis pub/sub
    admin:
      - fastapi_add_sqladmin         # FastAPI-native admin panel with auth gate
    testing_tools:
      - fastapi_add_factory          # factory_boy model factories
      - fastapi_add_contract_tests   # Pact consumer-driven contract tests
      - fastapi_add_load_profile     # k6 load profile for this project

  verify:
    - fastapi_detect_n_plus_one      # static N+1 detection
    - fastapi_security_scan          # hardcoded secrets + dangerous patterns
    - fastapi_dependency_audit       # outdated/vulnerable deps
    - fastapi_schema_coverage        # all models have typed schemas
    - fastapi_test_coverage_gaps     # routes missing test coverage
    - fastapi_api_spec_compliance    # routes match OpenAPI spec
    - fastapi_performance_baseline   # endpoint latency baselines

  operate:
    - fastapi_blast_radius           # impact analysis for model changes
    - fastapi_migration_diff         # diff ORM models vs DB schema
    - fastapi_dead_code_finder       # unreachable routes + unused modules
    - fastapi_api_changelog          # changelog from Git diff on routes
    - fastapi_dependency_graph       # import + DI dependency graph
    - fastapi_connection_pool_monitor  # pool config vs observed load
    - fastapi_error_rate_analyzer    # error rates by endpoint from logs
    - fastapi_sla_reporter           # SLA compliance report from metrics

  evolve:
    - fastapi_add_migration_data     # data-migration Alembic script
    - fastapi_refactor_model         # rename field / split model
    - fastapi_extract_service        # extract CRUD into service layer
    - fastapi_add_event_driven       # domain events + event bus
    - fastapi_add_i18n               # i18n scaffold (babel + accept-language)
    - fastapi_generate_sdk           # typed Python client SDK
    - fastapi_generate_admin_panel   # admin panel scaffold
    - fastapi_generate_docs          # documentation site

  proactive:
    - fastapi_doctor_tool            # runs all 7 verify tools, ordered fix plan

mcp_tools:
  total: 105
  tiers:
    orchestrator: [fastapi_generate_project]
    generators: 33
    verification: [fastapi_analyze, fastapi_analyze_project_v2, fastapi_fix_findings, fastapi_check_health, fastapi_check_headers]
    adapt_extend: 41
    adapt_verify: 7
    adapt_operate: 8
    adapt_evolve: 8
    adapt_proactive: 1

verification:
  analyzer:
    tool: fastapi_analyze
    checks: 35
    sources: "OWASP, CVE, NIST SP 800-63B, RFC 7515/7807, CIS Docker Benchmark, W3C Trace Context"

  test_suites:
    edge_cases: { file: "benchmark/test_generators.py", tests: 8 }
    integration: { file: "benchmark/test_integration.py", tests: "generate → install → import" }
    functional: { file: "benchmark/test_functional.py", tests: 25 }
    lint_generated: { file: "tests/test_lint_generated.py", tests: 8, notes: "ruff F-check + py_compile on generated output" }

benchmark:
  skill_v5: "35/35 (100%) + 105 tools + lint-verified output"
  golden_tiangolo_42k_stars: "24/35 (69%)"
  benavlabs_1800_stars: "20/35 (57%)"
  sonnet_naked: "21/35 (60%)"
  haiku_naked: "23/35 (66%)"
  functional_e2e: "25/25 endpoints pass"
  lint_generated: "22 F-errors (0 F821), 85/85 py_compile pass"
