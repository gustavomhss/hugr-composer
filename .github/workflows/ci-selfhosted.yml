name: SKILL-001 CI (self-hosted, parallel)

# Parallel CI on self-hosted runners (Gustavo's mac). The old single serial job
# was ~15min with 11/12 cores idle during non-parallel steps. This splits the
# suite into independent JOBS that run concurrently across multiple runner
# instances on the same mac → ~max(job) instead of sum(steps).
#
# Setup once: register extra runners with scripts/ci/setup-runners.sh (see
# docs/guides/ci-runners.md). All runners share one venv at $HOME/.hugr-ci-venv
# (built once by the `setup` job, reused — runners are persistent).
#
# Local Postgres on :5432 (user/pass/db = skill/skill/skill_e2e) for the pg jobs.

on:
  push:
    branches: [main]
    paths:
      - 'skills/SKILL-001-fastapi-production/**'
      - 'hugr_auth/**'
      - 'scripts/**'
      - 'docs/**'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - '.github/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # nightly full run (07:00 UTC)

concurrency:
  # Fixed group (NOT per-ref): only one CI run at a time on the shared single
  # runner pool. A new run cancels the prior — newest wins, never piles up.
  # (Per-ref grouping let PR + main + rapid merges stack and serialize for ~40min.)
  group: "ci-selfhosted"
  cancel-in-progress: true

env:
  VENV: /Users/gustavoschneiter/.hugr-ci-venv
  KIT: skills/SKILL-001-fastapi-production
  SECRET_KEY: ci-test-secret-key-must-be-32-chars-long!!!
  MFA_FERNET_KEY: L7gvXDh2v6syV65J0-iwLQMTYbVavNXO2vuXgntcFBo=
  RATE_LIMITING_ENABLED: 'false'
  ENVIRONMENT: local

jobs:
  # --- Shared venv build (idempotent; persistent runners reuse it) ----------
  setup:
    name: setup (shared venv)
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure shared venv
        working-directory: ${{ env.KIT }}
        run: |
          set -euo pipefail
          REQ_HASH=$(shasum requirements-mcp.txt 2>/dev/null | awk '{print $1}')
          STAMP="${VENV}/.req_hash"
          if [ ! -x "${VENV}/bin/python" ] || [ "$(cat "$STAMP" 2>/dev/null)" != "$REQ_HASH" ]; then
            echo "Building shared venv at ${VENV}"
            /usr/local/bin/python3.12 -m venv "${VENV}" || python3.12 -m venv "${VENV}"
            "${VENV}/bin/pip" install --quiet --upgrade pip
            "${VENV}/bin/pip" install --quiet -r requirements-mcp.txt
            "${VENV}/bin/pip" install --quiet \
              PyJWT alembic asyncpg email-validator fastapi "pwdlib[argon2]" \
              pydantic-settings pydantic python-multipart "redis[hiredis]==5.3.1" slowapi \
              "sqlalchemy[asyncio]" structlog "uvicorn[standard]" \
              pytest pytest-asyncio pytest-xdist ruff aiosqlite httpx \
              boto3 arq jinja2 strawberry-graphql==0.314.3 qrcode sse-starlette cryptography pyotp \
              aiodataloader msgpack
            echo "$REQ_HASH" > "$STAMP"
          else
            echo "Shared venv up to date (req hash $REQ_HASH)"
          fi

  # --- Lint + repo hygiene (fast) -------------------------------------------
  lint:
    name: lint
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint (ruff + hygiene, scoped to PR diff)
        run: |
          set -euo pipefail
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
          BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch -q --no-tags --unshallow origin 2>/dev/null || true
            git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
            BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          fi
          [ -z "$BASE" ] && { echo "::error::cannot determine diff base"; exit 1; }
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          # Exclude paths that pyproject.toml's ruff extend-exclude already
          # ignores: when ruff is invoked with explicit files it ignores
          # extend-exclude, so we mirror the rule here.
          #   - `_staging/` (formerly `_extracted/`) — staged-primitive pool,
          #     extracted snippets that are dirty by design and awaiting
          #     promotion; never linted.
          #   - `*.protocol.py` — type-protocol stubs that intentionally
          #     declare forward-referenced symbols without imports (N999 +
          #     F821 by design); they exist alongside the promoted primitive
          #     under `core/venous/<ns>/<Name>/<Name>.protocol.py`.
          PYF=$(echo "$CHANGED" | grep '\.py$' | grep -vE '\.venv|/emitted/|core/venous/_staging/|core/venous/_extracted/|\.protocol\.py$' || true)
          MDF=$(echo "$CHANGED" | grep '\.md$' || true)
          python3 scripts/checks/no_committed_venv.py
          if [ -n "$PYF" ]; then
            "${VENV}/bin/python" -m ruff check $PYF
            "${VENV}/bin/python" -m ruff format --check $PYF
            python3 scripts/checks/file_size.py $PYF || echo "::warning::file_size advisory"
          fi
          [ -n "$MDF" ] && python3 scripts/checks/md_location.py $MDF || true

  # --- Unit suite (the long pole; internally parallel) ----------------------
  unit:
    name: unit (pytest adapt/)
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: Unit tests
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        # -n 4 (not auto/12): the 12-core mac is SHARED with other projects' CI
        # (wallet runners) + dev work. Budget HuGR to ~half the machine: with 3
        # concurrent jobs (unit -n4 + 2 lighter), HuGR peaks ~6/12 cores, leaving
        # room for the neighbors. Avoids cross-project CPU thrash + boot-timeout flakes.
        run: "${VENV}/bin/python -m pytest adapt/ -q --tb=short -n 4 --dist loadfile"

  # --- Boot sweep: every tool boots a fresh project (internally threaded) ----
  # Split out of the old monolithic `composition` job (which ran boot + chains
  # + gates serially for ~46min). These three jobs now run concurrently across
  # the idle runners; each is internally parallel too.
  boot:
    name: boot (100 tools)
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: Per-tool boot sweep (4 threads)
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python tests/test_boot.py"

  # --- Composition chains (forward/reverse full + hot-path chains) -----------
  boot-chains:
    name: boot chains
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: Chains (5 chains in parallel)
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python -m pytest tests/test_boot_chains.py -n 3 -q --tb=short"

  # --- Regression net: P0 gates + property tests + contract/doc audit --------
  gates:
    name: regression + property + contract
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: P0 gates + property + contract audit
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_p0_regression_gates.py
          "${VENV}/bin/python" tests/property_tests.py
          "${VENV}/bin/python" -m engine.audit.contract_check

  # --- Integration: SQLite e2e + emitted-project audit ----------------------
  integration:
    name: integration (sqlite e2e)
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: SQLite E2E + emitted audit
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_e2e_hardcore.py
          "${VENV}/bin/python" tests/test_emitted_project_audit.py

  # --- Gate: HuGR auth (license/store/issuance/e2e) + MCP discovery ---------
  auth-mcp:
    name: auth + mcp gate
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: Auth gate + license/store/issuance/e2e + MCP discovery
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/${KIT}"
          PYTHONPATH=. "${VENV}/bin/python" tests/test_auth_gate.py
          cd "${{ github.workspace }}"
          PYTHONPATH=. "${VENV}/bin/python" hugr_auth/test_license.py
          PYTHONPATH=. "${VENV}/bin/python" hugr_auth/test_store.py
          PYTHONPATH=. "${VENV}/bin/python" hugr_auth/test_issuance.py
          PYTHONPATH=. "${VENV}/bin/python" hugr_auth/test_e2e_gate.py
          cd "${{ github.workspace }}/${KIT}"
          PYTHONPATH=. "${VENV}/bin/python" -c "import asyncio; from mcp_tools.server import mcp; from mcp_tools.discovery import discover_and_register; discover_and_register(mcp); n=len(asyncio.run(mcp.list_tools())); print(f'MCP discovery: {n} tools'); assert n>=170, f'expected >=170, got {n}'"

  # --- Postgres-backed: pg e2e + behavior scenarios -------------------------
  postgres-behavior:
    name: postgres + behavior
    needs: setup
    runs-on: [self-hosted, macos, local]
    env:
      E2E_POSTGRES_URL: postgresql+asyncpg://skill:skill@localhost:5432/skill_e2e
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: skill
      POSTGRES_PASSWORD: skill
      POSTGRES_DB: skill_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/${KIT}/.venv"
      - name: PostgreSQL E2E + behavior scenarios
        working-directory: ${{ env.KIT }}
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_e2e_postgres.py
          "${VENV}/bin/python" tests/test_behavior_scenarios.py
