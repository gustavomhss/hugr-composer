name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "skills/SKILL-001-fastapi-production/core/venous/**"
      - "skills/SKILL-001-fastapi-production/engine/primitives_by_concern.yaml"
      - "skills/SKILL-001-fastapi-production/engine/docs/**"
      - "skills/SKILL-001-fastapi-production/adapt/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/SKILL-001-fastapi-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install yaml (only dependency)
        run: python -m pip install pyyaml
      - name: Build site (verify idempotent)
        run: PYTHONPATH=. python -m engine.docs.build --verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skills/SKILL-001-fastapi-production/docs_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
