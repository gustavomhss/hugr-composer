name: docs-site

# DISABLED 2026-05-28: deploys to GitHub Pages from `ubuntu-latest` runners
# while GH Actions minutes are billing-blocked → every push to core/venous/**
# or adapt/** fails in seconds and pollutes PR/main check history. Auto push
# trigger removed; `workflow_dispatch` retained so the site can still be
# built on demand. The next architecture refactor will touch adapt/** and
# core/venous/** heavily — re-enable then with self-hosted (Pages can deploy
# from a self-hosted runner via `actions/deploy-pages@v4`).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/SKILL-001-fastapi-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install yaml (only dependency)
        run: python -m pip install pyyaml
      - name: Build site (verify idempotent)
        run: PYTHONPATH=. python -m engine.docs.build --verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skills/SKILL-001-fastapi-production/docs_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
