name: CI (self-hosted, parallel)

# Parallel CI on self-hosted runners (Gustavo's mac). The skill IS the repo
# root here (standalone extraction), so every command runs from the checkout
# root with PYTHONPATH=. — no monorepo skill subdir prefix.
#
# This splits the suite into independent JOBS that run concurrently across
# multiple persistent runner instances on the same mac → ~max(job) instead of
# sum(steps). All runners share one venv at $HOME/.hugr-ci-venv (built once by
# the `setup` job, reused — runners are persistent).
#
# Dependency install mirrors the two-file split this repo uses:
#   - requirements-mcp.txt  (MCP server + adapt-tool contracts + audit)
#   - requirements-apps.txt (app-runtime extras: strawberry, sqladmin, arq,
#                            slowapi, ... — without it boot/unit fail)
#
# Local Postgres on :5432 (user/pass/db = skill/skill/skill_e2e) for the pg jobs.

on:
  push:
    branches: [main]
    paths:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # nightly full run (07:00 UTC)

concurrency:
  # Fixed group (NOT per-ref): only one CI run at a time on the shared single
  # runner pool. A new run cancels the prior — newest wins, never piles up.
  group: "ci-skill-001-selfhosted"
  cancel-in-progress: true

env:
  VENV: /Users/gustavoschneiter/.hugr-ci-venv
  SECRET_KEY: ci-test-secret-key-must-be-32-chars-long!!!
  MFA_FERNET_KEY: L7gvXDh2v6syV65J0-iwLQMTYbVavNXO2vuXgntcFBo=
  RATE_LIMITING_ENABLED: 'false'
  ENVIRONMENT: local

jobs:
  # --- Shared venv build (idempotent; persistent runners reuse it) ----------
  setup:
    name: setup (shared venv)
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure shared venv
        run: |
          set -euo pipefail
          REQ_HASH=$(cat requirements-mcp.txt requirements-apps.txt | shasum | awk '{print $1}')
          STAMP="${VENV}/.req_hash"
          if [ ! -x "${VENV}/bin/python" ] || [ "$(cat "$STAMP" 2>/dev/null)" != "$REQ_HASH" ]; then
            echo "Building shared venv at ${VENV}"
            /usr/local/bin/python3.12 -m venv "${VENV}" || python3.12 -m venv "${VENV}"
            "${VENV}/bin/pip" install --quiet --upgrade pip
            "${VENV}/bin/pip" install --quiet -r requirements-mcp.txt
            "${VENV}/bin/pip" install --quiet -r requirements-apps.txt
            # Test-runner extras not pulled in by the two requirements files.
            "${VENV}/bin/pip" install --quiet pytest pytest-xdist ruff
            echo "$REQ_HASH" > "$STAMP"
          else
            echo "Shared venv up to date (req hash $REQ_HASH)"
          fi

  # --- Change detector: gate the heavy tool/app suites by path ---------------
  # The heavy suites (unit/boot/boot-chains/integration/postgres-behavior)
  # exercise the TOOLS and the emitted APP. Changes confined to dev-time engine
  # machinery (engine/**), docs, *.md, or skill.toml don't touch any of that, so
  # those suites are skipped for such PRs — the always-on `gates` job
  # (contract_check + property + p0 regression) is the engine safety net.
  # FAIL-SAFE: non-PR events (push to main / schedule / manual) and any
  # undetermined diff base run EVERYTHING; anything outside the light set
  # (deps, tests/, .github/, adapt/, app/, ...) flips heavy=true.
  changes:
    name: detect changes
    needs: setup
    runs-on: [self-hosted, macos, local]
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detect
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event (${GITHUB_EVENT_NAME}) → heavy=true (full suite)"
            exit 0
          fi
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
          BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch -q --no-tags --unshallow origin 2>/dev/null || true
            git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
            BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          fi
          if [ -z "$BASE" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot determine diff base → heavy=true (fail-safe full suite)"
            exit 0
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          echo "changed files:"; echo "$CHANGED"
          # LIGHT set = dev-time engine machinery + narrative/metadata only.
          # Everything else is HEAVY (fail-safe default).
          HEAVY_HITS=$(echo "$CHANGED" | grep -vE '^(engine/|docs/|skill\.toml$)' | grep -vE '\.md$' || true)
          if [ -n "$HEAVY_HITS" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "heavy paths touched → full suite:"; echo "$HEAVY_HITS"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "engine/docs-only change → skipping heavy tool/app suites (gates still runs)"
          fi

  # --- Lint (ruff, scoped to PR diff) ---------------------------------------
  lint:
    name: lint
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint (ruff check + format, scoped to PR diff)
        run: |
          set -euo pipefail
          TARGET="${GITHUB_BASE_REF:-main}"
          git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
          BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          if [ -z "$BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch -q --no-tags --unshallow origin 2>/dev/null || true
            git fetch -q --no-tags origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}" || true
            BASE=$(git merge-base "origin/${TARGET}" HEAD 2>/dev/null || true)
          fi
          [ -z "$BASE" ] && { echo "::error::cannot determine diff base"; exit 1; }
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)
          # Mirror pyproject.toml ruff extend-exclude (ignored when ruff is
          # invoked with explicit files):
          #   - core/venous/_staging/ — staged-primitive pool (dirty by design)
          #   - *.protocol.py — type-protocol stubs (N999 + F821 by design)
          PYF=$(echo "$CHANGED" | grep '\.py$' | grep -vE '\.venv|/emitted/|core/venous/_staging/|core/venous/_extracted/|\.protocol\.py$' || true)
          if [ -n "$PYF" ]; then
            "${VENV}/bin/python" -m ruff check $PYF
            "${VENV}/bin/python" -m ruff format --check $PYF
          fi
      - name: Hygiene — no committed venvs/site-packages/emitted/db
        run: "${VENV}/bin/python scripts/checks/no_committed_venv.py"
      - name: Hygiene — narrative markdown only under docs/
        run: "${VENV}/bin/python scripts/checks/md_location.py"

  # --- Unit suite (the long pole; internally parallel) ----------------------
  unit:
    name: unit (pytest adapt/)
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Unit tests
        env: { PYTHONPATH: . }
        # -n 4 (not auto/12): the 12-core mac is SHARED with other projects' CI
        # + dev work. Budget to ~half the machine to avoid cross-project CPU
        # thrash + boot-timeout flakes.
        run: "${VENV}/bin/python -m pytest adapt/ -q --tb=short -n 4 --dist loadfile"

  # --- Boot sweep: every tool boots a fresh project (internally threaded) ----
  boot:
    name: boot (100 tools)
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Per-tool boot sweep (4 threads)
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python tests/test_boot.py"

  # --- Composition chains (forward/reverse full + hot-path chains) -----------
  boot-chains:
    name: boot chains
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Chains (parallel)
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python -m pytest tests/test_boot_chains.py -n 3 -q --tb=short"

  # --- Regression net: P0 gates + property tests + contract/doc audit --------
  gates:
    name: regression + property + contract
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: P0 gates + property + contract audit
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_p0_regression_gates.py
          "${VENV}/bin/python" tests/property_tests.py
          "${VENV}/bin/python" -m engine.audit.contract_check

  # --- Integration: SQLite e2e + emitted-project audit ----------------------
  integration:
    name: integration (sqlite e2e)
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: SQLite E2E + emitted audit
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_e2e_hardcore.py
          "${VENV}/bin/python" tests/test_emitted_project_audit.py

  # --- Gate: auth gate + MCP discovery --------------------------------------
  auth-mcp:
    name: auth + mcp gate
    needs: setup
    runs-on: [self-hosted, macos, local]
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Auth gate + MCP discovery
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_auth_gate.py
          # Post WAVE-0-F2 (ADR-0003): default discovery surfaces Tier-1 meta +
          # a small default bundle slice (~18 tools) instead of the full 201;
          # the rest activate on demand. Assert two surfaces:
          #   (a) the lean default tools/list (<= 30 — clutter cap),
          #   (b) the full catalogue still reaches >= 170 after every bundle is
          #       activated (no tool got dropped during the refactor).
          "${VENV}/bin/python" -c "
          import asyncio, json, pathlib
          from mcp_tools.server import mcp
          from mcp_tools.discovery import discover_and_register, activate_bundle
          discover_and_register(mcp)
          default = len(asyncio.run(mcp.list_tools()))
          print(f'MCP discovery default surface: {default} tools')
          assert default <= 30, f'tier-1 surface must stay lean (<=30), got {default}'
          cat = json.loads(pathlib.Path('engine/index/catalog.json').read_text())
          for s in cat.get('skills', []):
              for b in s.get('bundles', []):
                  activate_bundle(b['name'])
          full = len(asyncio.run(mcp.list_tools()))
          print(f'MCP discovery full surface (all bundles active): {full} tools')
          assert full >= 170, f'expected >=170 after activating all bundles, got {full}'
          "

  # --- Engine machinery: the full engine/tests/ suite (ALWAYS-ON) -----------
  # GOVERNANCE: engine/tests/ is dev-time engine machinery (contract rules, the
  # capability trees, *_notes_invariants, manifest/compose/find, blind harness).
  # The `changes` detector treats engine/** as LIGHT and skips the heavy app
  # suites for engine-only PRs — so WITHOUT this always-on job an engine/tests/
  # regression on an engine-only change would sail through ungated. This job is
  # the engine safety net for that whole tree (866 tests). Pure-logic + loadfile
  # → xdist-safe.
  engine-tests:
    name: engine tests (engine/tests/)
    needs: setup
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: engine/tests suite
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python -m pytest engine/tests/ -q --tb=short -n 4 --dist loadfile"

  # --- Generated-output quality gate (HEAVY; pytest-collectable) -------------
  # Exercises the EMITTED app + generators: spec-compliance, generated-quality,
  # security-of-generated-code, bandit/deps, full-integration, http-smoke,
  # lint-of-generated, alembic chain, FK regression, concurrent, stress,
  # perf-baseline. Heavy family → skipped on engine/docs-only PRs. Several are
  # slow (~3-6m each) → generous timeout; -n 4 mirrors unit/boot CPU budget.
  quality:
    name: quality (generated-output suites)
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Generated-output quality suites
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" -m pytest \
            tests/test_spec_compliance.py \
            tests/test_generated_quality.py \
            tests/test_security_generated.py \
            tests/test_bandit_deps.py \
            tests/test_full_integration.py \
            tests/test_http_smoke.py \
            tests/test_lint_generated.py \
            tests/test_alembic_chain_root.py \
            tests/test_fk_regression.py \
            tests/test_concurrent.py \
            tests/test_stress.py \
            tests/test_performance_baseline.py \
            -q --tb=short -n 4 --dist loadfile

  # --- Generated-output quality gate (HEAVY; script-runners) -----------------
  # These tests are standalone runners (have main(), collect 0 under pytest), so
  # they must run as `python tests/<f>.py`, not via pytest. test_consistency
  # needs PYTHONPATH=. (imports the `tests` package). test_soak is a ~5m soak.
  quality-scripts:
    name: quality (script-runners)
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Consistency / determinism / soak / edge-cases runners
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_consistency.py
          "${VENV}/bin/python" tests/test_determinism.py
          "${VENV}/bin/python" tests/test_soak.py
          "${VENV}/bin/python" tests/test_edge_cases.py

  # --- Nightly-only extras (schedule event) ---------------------------------
  # NOT on the PR gate by design (documented, not silently dropped):
  #   - test_cross_composition.py: builds C(n,2) full-stack fixture projects
  #     (a fresh build+boot per pair). It NEVER fails, but its combinatorial
  #     build time can exceed 15min under a loaded shared runner — too slow/
  #     flaky-on-time for the PR critical path. Runs nightly with a wide budget.
  # KNOWN GAP (tracked, not gated anywhere yet):
  #   - test_realworld_ecommerce.py is a script-runner that needs a dedicated
  #     Postgres fixture (exits 2 without one). It is NOT yet wired here pending
  #     a verified PG fixture for it; do not assume it is covered.
  nightly-extras:
    name: nightly extras (cross-composition)
    needs: setup
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, macos, local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: Cross-composition (combinatorial full-stack builds)
        env: { PYTHONPATH: . }
        run: "${VENV}/bin/python -m pytest tests/test_cross_composition.py -q --tb=short -n 4 --dist loadfile"

  # --- Postgres-backed: pg e2e + behavior scenarios -------------------------
  postgres-behavior:
    name: postgres + behavior
    needs: [setup, changes]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, macos, local]
    env:
      E2E_POSTGRES_URL: postgresql+asyncpg://skill:skill@localhost:5432/skill_e2e
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: skill
      POSTGRES_PASSWORD: skill
      POSTGRES_DB: skill_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Link shared venv into checkout
        run: ln -sfn "${VENV}" "${{ github.workspace }}/.venv"
      - name: PostgreSQL E2E + behavior scenarios
        env: { PYTHONPATH: . }
        run: |
          set -euo pipefail
          "${VENV}/bin/python" tests/test_e2e_postgres.py
          "${VENV}/bin/python" tests/test_behavior_scenarios.py
