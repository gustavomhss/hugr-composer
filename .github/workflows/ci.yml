# SKILL-001: FastAPI Production — CI Pipeline
#
# Runs on every push and pull request to main/develop.
# Jobs:
#   1. test     — all 1020+ adapt tool unit tests (make test)
#   2. audit-l1 — correctness audit: tools parse, tests pass, orchestrator works
#   3. e2e      — full end-to-end chain (generate → adapt → validate)
#
# Matrix: Python 3.12 × 3.13

name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The skill root is the repo root; all make targets reference $(SKILL_ROOT).
  PYTHONPATH: .

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Unit tests (all 1020+ adapt tool tests)
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: "test / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-mcp.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mcp.txt

      - name: Run all adapt tool tests
        run: make test

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: L1 correctness audit
  # ──────────────────────────────────────────────────────────────────────────
  audit-l1:
    name: "audit-l1 / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: test          # only run if unit tests pass

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-mcp.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mcp.txt

      - name: Run L1 correctness audit
        run: make audit-l1

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: E2E chain (generate project → apply adapt tools → validate output)
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: "e2e / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: [test, audit-l1]   # final gate — requires both earlier jobs

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-mcp.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mcp.txt

      - name: Run E2E chain
        run: make e2e

      # ── Reference project smoke tests ──────────────────────────────────
      # Run each reference example script as an additional smoke test.
      # These scripts generate a complete project into a temp dir, apply
      # all adapt tools, and validate that every .py file parses cleanly.

      - name: Smoke test — E-commerce reference
        run: PYTHONPATH=. python3 docs/examples/ecommerce.py

      - name: Smoke test — SaaS B2B reference
        run: PYTHONPATH=. python3 docs/examples/saas_b2b.py

      - name: Smoke test — Event-Driven reference
        run: PYTHONPATH=. python3 docs/examples/event_driven.py
