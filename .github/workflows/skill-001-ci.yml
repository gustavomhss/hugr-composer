name: SKILL-001 CI

# CI test fixtures (SECRET_KEY, MFA_FERNET_KEY below) are scoped to this
# test harness only. They are:
#   - 32+ char deterministic strings / Fernet keys used by pytest suites
#     to exercise crypto paths without booting real infra.
#   - NEVER used by any emitted production code (grep the adapt/
#     and generators/ trees — not a single consumer).
#   - Identical to the literals in the test files themselves; replacing
#     the YAML values would require regenerating the tests.
# Rotating them is a coordinated change (CI yaml + ~10 test files at
# the same SHA). See README.md §test-fixtures for context.

on:
  push:
    branches: [main]
    paths:
      - 'skills/SKILL-001-fastapi-production/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/SKILL-001-fastapi-production/**'

defaults:
  run:
    working-directory: skills/SKILL-001-fastapi-production

env:
  # Centralized CI test fixtures — referenced per-job below via ${{ env.* }}.
  # These are TEST-ONLY; see the banner at the top of this file.
  CI_TEST_SECRET_KEY: ci-test-secret-key-must-be-32-chars-long!!!
  CI_TEST_MFA_FERNET_KEY: L7gvXDh2v6syV65J0-iwLQMTYbVavNXO2vuXgntcFBo=

jobs:
  unit-tests:
    name: Unit tests (3168 passing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet pytest pytest-asyncio aiosqlite
      - name: Run unit tests
        run: PYTHONPATH=. .venv/bin/python -m pytest adapt/ -q --tb=short
        env:
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local

  boot-tests:
    name: Boot 100/100 tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet pytest aiosqlite
      - name: Run boot tests
        run: PYTHONPATH=. .venv/bin/python tests/test_boot.py
        env:
          SECRET_KEY: ${{ env.CI_TEST_SECRET_KEY }}
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local

  property-tests:
    name: Property tests (8 properties × ~55 tools)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet aiosqlite
      - name: Run property tests
        run: PYTHONPATH=. .venv/bin/python tests/property_tests.py
        env:
          SECRET_KEY: ${{ env.CI_TEST_SECRET_KEY }}
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local

  sqlite-e2e:
    name: SQLite E2E hardcore (12 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet pytest aiosqlite httpx
      - name: Run SQLite E2E
        run: PYTHONPATH=. .venv/bin/python tests/test_e2e_hardcore.py
        env:
          SECRET_KEY: ${{ env.CI_TEST_SECRET_KEY }}
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local

  postgres-e2e:
    name: PostgreSQL E2E (8 scenarios, 27 tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skill
          POSTGRES_PASSWORD: skill
          POSTGRES_DB: skill_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet pytest aiosqlite httpx asyncpg
      - name: Run PostgreSQL E2E
        run: PYTHONPATH=. .venv/bin/python tests/test_e2e_postgres.py
        env:
          SECRET_KEY: ${{ env.CI_TEST_SECRET_KEY }}
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local
          MFA_FERNET_KEY: ${{ env.CI_TEST_MFA_FERNET_KEY }}
          E2E_POSTGRES_URL: postgresql+asyncpg://skill:skill@localhost:5432/skill_e2e
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: skill
          POSTGRES_PASSWORD: skill
          POSTGRES_DB: skill_e2e

  behavior-scenarios:
    name: Behavior scenarios (12 domains, 65+ assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skill
          POSTGRES_PASSWORD: skill
          POSTGRES_DB: skill_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
          .venv/bin/pip install --quiet pytest aiosqlite httpx asyncpg
      - name: Run behavior scenarios
        run: PYTHONPATH=. .venv/bin/python tests/test_behavior_scenarios.py
        env:
          SECRET_KEY: ${{ env.CI_TEST_SECRET_KEY }}
          RATE_LIMITING_ENABLED: 'false'
          ENVIRONMENT: local
          MFA_FERNET_KEY: ${{ env.CI_TEST_MFA_FERNET_KEY }}
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: skill
          POSTGRES_PASSWORD: skill
          POSTGRES_DB: skill_e2e

  benchmark-score:
    name: Benchmark score non-regressive (Phase-3 harness)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
      - name: Verify benchmarks/latest_score.json (schema + floor)
        run: |
          PYTHONPATH=. .venv/bin/python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("benchmarks/latest_score.json")
          data = json.loads(p.read_text())
          required = {"overall", "by_tier", "methodology", "kit_version"}
          missing = required - data.keys()
          assert not missing, f"latest_score.json missing keys: {missing}"
          overall = float(data["overall"])
          # Floor enforced by CONTRACT §B3.5. The live regression floor is
          # tightened dynamically by engine.audit.contract_check using the
          # previously-published score; this job only enforces the hard
          # schema floor of 30 so catastrophic regressions fail CI fast.
          assert overall >= 30.0, f"overall score regressed below hard floor: {overall}"
          print(f"benchmark overall={overall:.2f} methodology={data['methodology']}")
          PY
      - name: Run contract_check (full 28-rule audit)
        run: PYTHONPATH=. .venv/bin/python -m engine.audit.contract_check --quiet

  mcp-discovery:
    name: MCP discovery (≥170 tools)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements-mcp.txt
      - name: Verify MCP tool discovery
        run: |
          PYTHONPATH=. .venv/bin/python - <<'PY'
          import asyncio
          from mcp_tools.server import mcp
          from mcp_tools.discovery import discover_and_register
          count = discover_and_register(mcp)
          # Current: 180. Floor is 170 (10-tool safety margin against a
          # rename or temporary deprecation pass). Raise this floor in
          # lockstep with any intentional surface shrinkage.
          assert count >= 170, f"Expected >= 170 tools, got {count}"
          tools = asyncio.run(mcp.list_tools())
          assert len(tools) >= 170, f"list_tools returned {len(tools)}"
          print(f"MCP discovery: {len(tools)} tools registered")
          PY
