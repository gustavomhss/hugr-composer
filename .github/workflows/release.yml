name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Job 1: Build and publish hugr-fastapi wheel
  hugr-fastapi:
    name: Publish hugr-fastapi Wheel
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Regenerate wheel source from core/venous/
        run: |
          uvx -p 3.12 python -m engine.promotion.emit_wheel_source
        env:
          PYTHONPATH: .

      - name: Build wheel
        working-directory: packaging/hugr-fastapi
        run: uv build --wheel

      - name: Verify wheel
        working-directory: packaging/hugr-fastapi
        run: |
          python -c "
          import zipfile
          import glob
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              files = [n for n in z.namelist() if n.endswith('.py') and 'hugr_fastapi' in n]
              print(f'Python modules in wheel: {len(files)}')
              for f in sorted(files)[:10]:
                  print(f'  {f}')
              if len(files) > 10:
                  print(f'  ... and {len(files)-10} more')
          assert len(files) > 50, 'Wheel missing modules'
          print('Wheel verification passed')
          "

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packaging/hugr-fastapi/dist
          skip-existing: true
          verbose: true

  # Job 2: Build and release hugr-arsenal (MCP server + plugin)
  hugr-arsenal:
    name: Release hugr-arsenal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-mcp.txt pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_boot.py -q
          python -m pytest adapt/evolve/ adapt/operate/ adapt/verify/ adapt/proactive/ -q -k "behavior" --tb=short

      - name: Create release archive
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir -p dist
          tar -czf dist/hugr-arsenal-${TAG}.tar.gz \
            --exclude=.git \
            --exclude=__pycache__ \
            --exclude=.venv \
            --exclude=dist \
            --exclude=.pytest_cache \
            --exclude=benchmarks/blind/results \
            --exclude=.claude-plugin/plugin.json \
            --exclude=.mcp.json \
            --exclude=opencode.json \
            .

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/hugr-arsenal-${{ github.ref_name }}.tar.gz
          generate_release_notes: true

  # Job 3: Build and push Gateway Docker image
  claude-gateway:
    name: Build & Push Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/humangr-labs/claude-gateway
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run --rm ghcr.io/humangr-labs/claude-gateway:${{ github.ref_name }} python -c "import gateway.main; print('Gateway imports OK')"

  # Job 4: Helm chart release
  helm-chart:
    name: Release Helm Chart
    needs: claude-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Helm chart
        run: |
          helm package helm/claude-gateway --destination dist/

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.tgz
          generate_release_notes: true

  # Job 5: Sync versions & create unified release
  unify-release:
    name: Create Unified Release
    needs: [hugr-fastapi, hugr-arsenal, claude-gateway, helm-chart]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unified release notes
        id: notes
        run: |
          TAG=${GITHUB_REF_NAME}
          cat << 'EOF' > release_notes.md
          # HuGR Arsenal ${{ github.ref_name }}

          ## 📦 Artifacts

          | Artifact | Version | Location |
          |----------|---------|----------|
          | hugr-fastapi (PyPI) | ${{ github.ref_name }} | `pip install hugr-fastapi==${{ github.ref_name }}` |
          | hugr-arsenal (MCP) | ${{ github.ref_name }} | [Download](https://github.com/humangr-labs/skill-001-fastapi-production/releases/tag/${TAG}) |
          | claude-gateway (Docker) | ${{ github.ref_name }} | `docker pull ghcr.io/humangr-labs/claude-gateway:${{ github.ref_name }}` |
          | claude-gateway (Helm) | ${{ github.ref_name }} | `helm pull oci://ghcr.io/humangr-labs/claude-gateway --version ${{ github.ref_name }}` |

          ## 🚀 Quick Start

          \`\`\`bash
          # 1. Install runtime primitives
          pip install hugr-fastapi==${{ github.ref_name }}

          # 2. Install MCP server (opencode/Claude)
          curl -fsSL https://github.com/humangr-labs/skill-001-fastapi-production/releases/download/${TAG}/install.sh | bash

          # 3. Deploy gateway (optional)
          docker run -d -p 8080:8080 \
            -e OPENAI_API_KEY=... \
            ghcr.io/humangr-labs/claude-gateway:${{ github.ref_name }}
          \`\`\`

          ## 📋 Changelog
          See [CHANGELOG.md](https://github.com/humangr-labs/skill-001-fastapi-production/blob/main/CHANGELOG.md)
          EOF
          cat release_notes.md

      - name: Update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          make_latest: true
