[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hugr-composer"
version = "0.1.0"
description = "HuGR Composer — FastAPI production skill: primitives, generators, and tree dispatchers for production-grade FastAPI apps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "HumanGR Labs", email = "gustavo@humangr.com"}
]
keywords = ["fastapi", "code-generation", "scaffolding", "primitives", "mcp", "hugr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "slowapi>=0.1.9",
    "PyJWT>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "fastmcp>=0.1.0",
    "pydantic-core>=2.18.0",
    "tenacity>=8.2.3",
    "orjson>=3.9.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
hugr-composer = "mcp_tools.cli:main"

[project.entry-points.mcp]
hugr-composer = "mcp_tools.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.6.0",
    "httpx[http2]>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "mcp_tools*",
    "engine*",
    "adapt*",
    "modules*",
    "generators*",
    "core*",
    "primitives*",
    "maintenance*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "BLE", "C4", "C901", "SIM", "T20", "PIE", "PT", "Q", "RUF", "SLF", "TRY", "S101", "S112", "S311", "ASYNC110"]
ignore = ["TRY003", "N999"]
per-file-ignores = { "tests/*" = ["S101", "SLF001"], "**/test_*.py" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
enable_error_code = ["unused-ignore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -x"

[tool.coverage.run]
source = ["mcp_tools", "engine", "adapt", "modules", "generators", "core", "primitives"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
